# neoforge.mods.toml — NeoForge renamed META-INF/mods.toml to this filename; a leftover mods.toml is ignored.
# Lives under src/main/templates so the generateModMetadata task expands the ${...} tokens. TOML v0.5.0.
modLoader="javafml" # mandatory
loaderVersion="${loader_version_range}" # mandatory — FML loader major-version range (NeoForge 1.21.x = 4.x)
license="${mod_license}"

[[mods]] # mandatory
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- dependencies ---
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Patchouli powers the in-game Grimoire guide book. Mandatory: the book IS the feature.
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="required"
    versionRange="[1.21.1,)"
    ordering="AFTER"
    side="BOTH"
