# Memory for the Minecraft decompile step. daemon=false matches the repo convention (pass --no-daemon too).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# The only system Java 21 here is a JRE (no javac), which NeoForm's recompile cannot use.
# Ignore detected local JVMs and let the foojay resolver download a real JDK 21 toolchain.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

## Environment — NeoForge 1.21.1 stack (resolved from maven; do not bump blind)

# MC version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
# NeoForge uses the literal single-version form here, not the open [1.21.1,1.22) range.
minecraft_version_range=[1.21.1]
# NeoForge artifact version (replaces forge_version).
neo_version=21.1.234
# NeoForge dependency range for neoforge.mods.toml.
neo_version_range=[21.1,)
# FML loader major-version range (NeoForge 1.21.x is FML loader 4.x).
loader_version_range=[4,)

# Parchment mappings (community param names + javadoc, layered on official).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

